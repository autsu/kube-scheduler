name: Sync from kubernetes release

on:
  schedule:
    # Every day 04:20 UTC
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Kubernetes release tag to sync (e.g. v1.37.1). Empty = latest."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Resolve target tag
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(gh api repos/kubernetes/kubernetes/releases/latest --jq .tag_name)"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected tag: $TAG" >&2
            exit 1
          fi
          MINOR="${TAG#v}"
          MINOR="${MINOR%.*}"
          BRANCH="release-${MINOR}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> branch $BRANCH"

      - name: Skip if tag already exists
        id: skip
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already present, skip."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync tree from kubernetes
        if: steps.skip.outputs.exists != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          chmod +x scripts/sync-from-kubernetes.sh
          ./scripts/sync-from-kubernetes.sh "$TAG"

      - name: Commit, branch, tag, push
        if: steps.skip.outputs.exists != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          BRANCH: ${{ steps.ver.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes; still ensuring tag exists."
          else
            git commit -m "sync: extract kube-scheduler from kubernetes ${TAG}"
          fi

          git tag -f "$TAG"
          git push -u origin "HEAD:${BRANCH}"
          git push origin "refs/tags/${TAG}"
